[project]
name = "research-map-backend"
version = "0.1.0"
description = "Local API for the autonomous research map"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "mcp==1.29.1",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.2.3",
    "pypdf==6.0.0",
    "rich==14.1.0",
    "sqlalchemy==2.0.43",
    "typer==0.16.1",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
research-map-bootstrap = "research_map_backend.agents.bootstrap:main"
research-map-migrate = "research_map_backend.migrations:main"
research-map-agent = "research_map_backend.agent_cli:main"
research-map = "research_map_backend.cli:main"
research-map-stub-smoke = "research_map_backend.smoke:stub_main"
research-map-live-smoke = "research_map_backend.smoke:live_main"
research-map-data = "research_map_backend.data_cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_map_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
